<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?
    family=Poppins:wght@400;500;600;700&
    display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../output.css">
</head>

<body class="min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 w-full z-20 bg-common header">
    </header>
    <main class="flex-1 mt-[150px]">
        <section
            style="background-image: url(../imgs/Breadcrumbs.png); background-position: center; background-size: cover; background-repeat: no-repeat;"
            class="py-[48px]">
            <div class="container flex items-center gap-3 text-grays-500">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#808080" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-house-icon lucide-house">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                        <path
                            d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <p>></p>
                <p>Account</p>
                <p>></p>
                <p class="text-primary">Create Account</p>
            </div>
        </section>
        <section
            class="mx-[20px] max-w-[520px] px-6 pt-6 pb-8 bg-common rounded-lg shadow-sign-in md:mx-auto my-20 flex flex-col gap-5">
            <h2 class="text-center title">Create Account</h2>
            <form action="" class="space-y-3">
                <div>
                    <label for="" class="hidden">Email</label>
                    <input type="email" placeholder="Email"
                        class="w-full border border-grays-100 rounded-md py-[14px] px-4">
                </div>
                <div class="relative">
                    <label for="" class="hidden">Password</label>
                    <input type="password" placeholder="Password"
                        class="w-full border border-grays-100 rounded-md py-[14px] px-4">
                    <button class="absolute top-1/2 -translate-y-1/2 right-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye-icon lucide-eye">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="relative">
                    <label for="" class="hidden">Confirm Password</label>
                    <input type="password" placeholder="Confirm Password"
                        class="w-full border border-grays-100 rounded-md py-[14px] px-4">
                    <button class="absolute top-1/2 -translate-y-1/2 right-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye-icon lucide-eye">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="text-[14px] text-grays-600">
                    <label>
                        <input type="checkbox" name="remember">
                        Accept all terms & Conditions
                    </label>
                </div>
                <button type="button" class="btn-primary w-full block bg-primary text-common font-semibold">
                    Create Account
                </button>

            </form>
            <p class="text-center text-grays-600 text-[14px]">
                Already have account?
                <a href="./signIn.html" class="text-blacks-900 font-semibold hover:underline">Login</a>
            </p>
        </section>
    </main>
    <footer class="footer">
    </footer>
    <script src="../main.js"></script>
</body>

</html>
