<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?
    family=Poppins:wght@400;500;600;700&
    display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../output.css">
</head>

<body class="min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 w-full z-20 bg-common header">

    </header>
    <main class="flex-1 mt-[150px]">
        <section
            style="background-image: url(../imgs/Breadcrumbs.png); background-position: center; background-size: cover; background-repeat: no-repeat;"
            class="py-[48px]">
            <div class="container flex items-center gap-3 text-grays-500">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#808080" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-house-icon lucide-house">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                        <path
                            d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <p>></p>
                <p class="text-primary">Shopping cart</p>
            </div>
        </section>
        <section class="container">
            <h2 class="text-center text-[32px] font-semibold mt-10 mb-8">My Shopping Cart</h2>
            <div class="flex flex-wrap xl:flex-nowrap gap-6">
                <div class="w-full">
                    <div class="w-full border-0 md:border rounded-xl">
                        <div class="block md:hidden space-y-4">
                            <div class="flex gap-3 border p-3 rounded-lg">
                                <img src="../imgs/Capsicum.png" class="card-img" />

                                <div class="flex-1">
                                    <h3 class="font-medium">Green Capsicum</h3>
                                    <p class="text-sm text-grays-500">$14.00</p>

                                    <div class="flex items-center justify-between mt-2">
                                        <div
                                            class="flex items-center justify-between border rounded-full min-w-[100px] px-3">
                                            <button type="button" class=""><svg xmlns="http://www.w3.org/2000/svg"
                                                    fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                                    stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                                                </svg>
                                            </button>
                                            <span class="px-2">5</span>
                                            <button type="button" class="">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M12 4.5v15m7.5-7.5h-15" />
                                                </svg>
                                            </button>
                                        </div>

                                        <span class="font-semibold">$70.00</span>
                                    </div>
                                </div>

                            </div>
                            <div class="flex gap-3 border p-3 rounded-lg">
                                <img src="../imgs/red-chili.png" class="card-img" alt="red-chili" />
                                <div class="flex-1">
                                    <h3 class="font-medium">Red Capsicum</h3>
                                    <p class="text-sm text-grays-500">$14.00</p>

                                    <div class="flex items-center justify-between mt-2">
                                        <div
                                            class="flex items-center justify-between border rounded-full min-w-[100px] px-3">
                                            <button type="button" class=""><svg xmlns="http://www.w3.org/2000/svg"
                                                    fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                                    stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                                                </svg>
                                            </button>
                                            <span class="px-2">5</span>
                                            <button type="button" class="">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M12 4.5v15m7.5-7.5h-15" />
                                                </svg>
                                            </button>
                                        </div>

                                        <span class="font-semibold">$70.00</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <table class="w-full hidden md:table">
                            <thead class="border-b">
                                <tr>
                                    <td class="py-4 pl-5 title-card">Product</td>
                                    <td class="py-4 title-card">Price</td>
                                    <td class="py-4 title-card">Quantity</td>
                                    <td class="py-4 title-card">Subtotal</td>
                                    <td class="py-4 title-card"></td>
                                </tr>
                            </thead>
                            <tbody class="">
                                <tr class="border-b">
                                    <td>
                                        <div class="py-3 pl-5 flex items-center gap-3">
                                            <div class="card-img">
                                                <img src="../imgs/Capsicum.png" alt="Capsicum">
                                            </div>
                                            <h3>Green Capsicum</h3>
                                        </div>
                                    </td>
                                    <td class="py-3">
                                        $14.00
                                    </td>
                                    <td class="py-3">
                                        <div class="btn-quantity">
                                            <button type="button" class="btn-decrease"><svg
                                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                                                </svg>
                                            </button>
                                            <p>5</p>
                                            <button type="button" class="btn-increase">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="xl:size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M12 4.5v15m7.5-7.5h-15" />
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                    <td class="py-3 ">$70.00</td>
                                    <td class="py-3 mr-5">
                                        <button class="size-6 border rounded-full flex items-center justify-center">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                stroke-width="1.5" stroke="currentColor" class="size-5">
                                                <path stroke-linecap="round" stroke-linejoin="round"
                                                    d="M6 18 18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </td>
                                </tr>
                                <tr class="border-b">
                                    <td class="py-3 pl-5 flex items-center gap-3">
                                        <div class="card-img">
                                            <img src="../imgs/red-chili.png" alt="Capsicum">
                                        </div>
                                        <h3>Red Capsicum</h3>
                                    </td>
                                    <td class="py-3">
                                        $14.00
                                    </td>
                                    <td class="py-3">
                                        <div class="btn-quantity">
                                            <button type="button" class="btn-decrease"><svg
                                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                                                </svg>
                                            </button>
                                            <p>5</p>
                                            <button type="button" class="btn-increase">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M12 4.5v15m7.5-7.5h-15" />
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                    <td class="py-3 ">$70.00</td>
                                    <td class="py-3 mr-5">
                                        <button class="size-6 border rounded-full flex items-center justify-center">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                stroke-width="1.5" stroke="currentColor" class="size-5">
                                                <path stroke-linecap="round" stroke-linejoin="round"
                                                    d="M6 18 18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="5" class="py-3 px-5">
                                        <div class="flex justify-between">
                                            <button
                                                class="bg-grays-50 py-[14px] px-8 rounded-full text-[14px] font-semibold">Return
                                                to shop</button>
                                            <button
                                                class="bg-grays-50 py-[14px] px-8 rounded-full text-[14px] font-semibold">Update
                                                Cart</button>
                                        </div>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div class="flex items-center flex-wrap md:flex-nowrap gap-6 border rounded-[10px] mt-6 p-5">
                        <h3 class="text-[20px]">Coupon Code</h3>
                        <form action="" class="md:relative">
                            <label for="" hidden>Code</label>
                            <input type="text" placeholder="Enter code"
                                class="min-w-full md:min-w-[420px] xl:min-w-[473px] 2xl:min-w-[531px] border rounded-full px-6 py-3 md:py-[14px]">
                            <button type="button"
                                class="md:absolute text-common bg-blacks-900 py-3 px-8 md:py-4 md:px-10 rounded-full -right-[130px] hover:opacity-70 duration-500 font-semibold mt-6 md:mt-0 min-w-full  md:min-w-[196px]">Apply
                                Coupon</button>
                        </form>
                    </div>
                </div>
                <div class="border rounded-[10px] p-6 w-full xl:max-w-[324px] 2xl:max-w-[424px] max-h-[296px]">
                    <h2 class="text-lg font-semibold mb-4">Cart Total</h2>
                    <div>
                        <div class="flex justify-between py-3 text-[14px]">
                            <span class="text-grays-700">Subtotal:</span>
                            <span>$84.00</span>
                        </div>

                        <div class="flex justify-between border-t py-3 text-[14px]">
                            <span class="text-grays-700">Shipping:</span>
                            <span>Free</span>
                        </div>

                        <div class="flex justify-between border-t pt-4 text-[16px]">
                            <span class="text-grays-700">Total:</span>
                            <span class="font-semibold">$84.00</span>
                        </div>

                    </div>

                    <button class="mt-5 w-full bg-primary text-white py-3 rounded-full hover:opacity-70 duration-500">
                        Proceed to checkout
                    </button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">


    </footer>
    <script src="../main.js"></script>
</body>

</html>
